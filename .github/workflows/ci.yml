# CI for the copy package.
#
# This did not exist until 2026-08-27, which matters more than a missing-workflow bug usually
# would: curio-shared/decisions/0026 asserted that RoundTripTest.kt "runs in that repo's CI today"
# and used that as the evidence that a Kotlin conformance suite is feasible. The test file was
# real; the CI was not. decisions/0026's load-bearing rule is "any platform failing any vector
# fails CI", and for Kotlin that rule had nothing behind it.
#
# That is precisely the failure mode 0026 itself warns about — a suite that looks like enforcement
# and is not — so the fix is this file, not a softening of the rule.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # The generated Swift/Kotlin/dist output must match a fresh build of the schemas. Catches a
      # generator change that was never regenerated, and a hand-edit of generated output.
      - run: npm run check

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned. The Kotlin 2.0.20 compiler throws an internal error on JDK version strings it
      # cannot parse, so "whatever JDK the runner defaults to" is not a safe input for this job.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # StringsTest — the generated Kotlin really carries the strings, keyed by the RAW WIRE VALUE.
      # Without it, "Android can consume @curio/copy" is a claim about a file existing, which is
      # the mistake decisions/0026 records against this project's own conformance claims.
      - run: ./gradlew test --no-daemon

  swift:
    # The same gap curio-contracts had until 2026-08-31: a Kotlin job, no Swift job, and a Swift
    # package that was generated, committed, and NEVER COMPILED — including eight tests in
    # Tests/CurioCopyTests that had never once run. They pass; nothing was checking that they did.
    #
    # In curio-contracts that gap let decisions/0027's forward-compatible decoding ship on Android
    # and silently not ship on iOS for three days. The exposure here is smaller — copy is strings,
    # not decode behaviour — but the shape is identical, and the reason it went unnoticed in both
    # places is this job not existing.
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      # StringsTests / FormatTests — the generated Swift really carries the strings and formats
      # them, rather than merely being a file that exists in the right place.
      - run: swift test
